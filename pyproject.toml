[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spirula-lidar"
version = "0.1.0"
description = "Image-only Spirula reconstruction with checked metric LiDAR alignment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10", "plyfile>=1.0", "laspy[lazrs]>=2.5"]

[project.optional-dependencies]
worker = ["ultralytics>=8.3", "pycolmap>=3.11"]
features = ["open3d>=0.19"]
test = ["pytest>=8"]

[project.scripts]
spirula-lidar = "spirula_lidar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
